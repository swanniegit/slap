; Production PHP settings, applied at SYSTEM level via conf.d.
;
; They belong here rather than in a .user.ini because .user.ini would itself sit
; in the webroot (one more file to defend) and is only PHP_INI_PERDIR — it
; cannot set expose_php at all.

; Stops the X-Powered-By header advertising the exact PHP patch level, which is
; the first thing a scanner reads to pick an exploit.
expose_php = Off

; HAZARD: a notice or warning rendered into a response leaks absolute server
; paths, and lib/enquiry.php's mail failure path names the SMTP host and
; username. It would also corrupt any non-HTML response by printing before the
; body. Errors go to stderr, where Coolify collects them.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED

; The sisters, the enquiries and the "we reply within X" promise are all local
; time. Without this PHP defaults to UTC and every logged enquiry timestamp is
; two hours behind what the customer saw.
date.timezone = Africa/Johannesburg

memory_limit = 128M
max_execution_time = 30

; The enquiry form is text only — photos come later over WhatsApp or email — so
; these stay small deliberately. A large limit here is free upload bandwidth for
; anyone who finds the endpoint.
post_max_size = 4M
upload_max_filesize = 2M
max_input_vars = 200

; No login exists today, but the honeypot/timing guard uses a session. Harden it
; now so adding anything session-backed later cannot ship an insecure cookie.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
