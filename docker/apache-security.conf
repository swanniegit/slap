# Server-level hardening, applied with a2enconf.
#
# It lives here rather than in .htaccess because .htaccess is a file in the
# webroot that anyone editing the site can break or delete. These directives
# survive that.

# Apache's default banner names the version and OS in every response and on
# every error page — free reconnaissance.
ServerTokens Prod
ServerSignature Off

# TRACE echoes request headers back, which is the mechanism behind cross-site
# tracing. Nothing on this site uses it.
TraceEnable Off

<Directory /var/www/html>
    # -Indexes: assets/img/bears/ has no index file, and without this Apache
    # would happily list the whole folder.
    # -MultiViews: content negotiation would let /enquiry resolve to
    # /enquiry.php-ish guesses and quietly create URLs that are not in
    # lib/pages.php, splitting canonicals.
    Options -Indexes -MultiViews

    # .htaccess carries the rewrites and headers, so overrides must be allowed.
    AllowOverride All
    Require all granted

    DirectoryIndex index.php index.html
</Directory>

# Belt and braces. .dockerignore should keep these out of the image entirely,
# but a public webroot must never serve a VCS or tooling directory even if one
# arrives by another route — a served .git/ hands over the full source history.
<DirectoryMatch "/var/www/html/\.(git|github|claude)">
    Require all denied
</DirectoryMatch>
